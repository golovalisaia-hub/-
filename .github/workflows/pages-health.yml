name: Academy public site health
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-health.yml'
      - 'index.html'
      - 'home.css'
      - 'home.js'
      - 'path.html'
      - 'path.css'
      - 'path-redesign.css'
      - 'path-entry.js'
      - 'path.js'
      - 'path-lessons.js'
      - 'studio.html'
      - 'foundation.js'
      - 'foundation.css'
      - 'vendor/supabase.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-url:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check published dashboard, lesson, archive and required assets
        shell: bash
        run: |
          set -euo pipefail
          HOST=golovalisaia-hub.github.io
          BASE="https://$HOST/-/"
          fail=0
          for path in '' home.css home.js path.html path.css path-redesign.css path-entry.js path.js path-lessons.js studio.html studio.css studio-extras.css curriculum.js lesson-guide.js studio.js studio-extras.js library.html python-worker.mjs foundation.js foundation.css vendor/supabase.js; do
            url="$BASE$path"
            status=$(curl -sSL --retry 2 --retry-delay 2 --connect-timeout 8 --max-time 20 -o /tmp/academy-health-body -w '%{http_code}' "$url") || status=000
            printf '%-23s HTTP %s\n' "${path:-/}" "$status"
            if [ "$status" != 200 ]; then fail=1; fi
            if [ "$status" = 200 ] && [ -z "$path" ]; then
              grep -q 'id="mapTitle"' /tmp/academy-health-body || { echo 'The homepage has not published the new dashboard yet'; fail=1; }
            fi
            if [ "$status" = 200 ] && [ "$path" = path.html ]; then
              grep -q 'path-entry.js' /tmp/academy-health-body || { echo 'Lesson deep-link navigation missing'; fail=1; }
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo 'FAIL: Public dashboard or required asset unavailable. Check Pages deployment.'
            exit 1
          fi
          echo 'PASS: Public Academy shows a separate dashboard and working QA + English route.'

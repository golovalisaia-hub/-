name: Academy checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript parses
        run: |
          node --check curriculum.js
          node --check lesson-guide.js
          node --check studio-extras.js
          node --check app.js
          node --check studio.js
          node --check python-worker.mjs
          node --check learning-checks.js
          node --check academy-quality.js
          node --check foundation.js
          node --check path-lessons.js
          node --check path.js
          node --check home.js
          node --check path-entry.js
          node --check library.js
      - name: Validate legacy curriculum, content and UI wiring
        run: node tests/smoke.cjs
      - name: Validate learning feedback and revision quizzes
        run: node tests/quality.cjs
      - name: Validate QA-first curriculum, dashboard and cloud isolation
        run: node tests/path.cjs
